<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outsource Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>

<body>
  <div class="app-wrapper">

    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>

      <div class="sidebar-content" id="sidebarContent">

        <!-- Выбор месяца и года -->
        <div class="period-selector">
          <select id="monthSelect">
            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>
          </select>
          <select id="yearSelect">
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
          </select>
        </div>

        <!-- Навигация -->
        <nav class="sidebar-nav">
          <button class="nav-btn active" id="btnProjects">Projects</button>
          <button class="nav-btn" id="btnEmployees">Employees</button>
        </nav>

        <!-- Кнопка Seed Data -->
        <button class="seed-btn" id="seedBtn">Seed Data</button>

      </div>
    </aside>

    <!-- ОСНОВНАЯ ОБЛАСТЬ -->
    <main class="main-content" id="mainContent">

      <!-- Вкладка проектов -->
      <section class="view" id="projectsView">
        <div class="view-header">
          <h2>Projects</h2>
          <button class="add-btn" id="addProjectBtn">+ Add Project</button>
        </div>

        <!-- Чипы фильтров -->
        <div class="filter-chips" id="projectFilterChips"></div>

        <!-- Таблица проектов -->
        <div class="table-wrapper">
          <table class="data-table" id="projectsTable">
            <thead>
              <tr>
                <th>Company <span class="sort-icon" data-col="company">⇅</span> <span class="filter-icon"
                    data-col="company">⌕</span></th>
                <th>Project <span class="sort-icon" data-col="name">⇅</span> <span class="filter-icon"
                    data-col="name">⌕</span></th>
                <th>Budget <span class="sort-icon" data-col="budget">⇅</span></th>
                <th>Capacity <span class="sort-icon" data-col="capacity">⇅</span></th>
                <th>Employees</th>
                <th>Est. Income <span class="sort-icon" data-col="income">⇅</span></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="projectsBody"></tbody>
          </table>
        </div>

        <!-- Итоговый доход -->
        <div class="total-income" id="totalIncome"></div>
      </section>

      <!-- Вкладка сотрудников -->
      <section class="view hidden" id="employeesView">
        <div class="view-header">
          <h2>Employees</h2>
          <button class="add-btn" id="addEmployeeBtn">+ Add Employee</button>
        </div>

        <!-- Чипы фильтров -->
        <div class="filter-chips" id="employeeFilterChips"></div>

        <!-- Таблица сотрудников -->
        <div class="table-wrapper">
          <table class="data-table" id="employeesTable">
            <thead>
              <tr>
                <th>Name <span class="sort-icon" data-col="name">⇅</span> <span class="filter-icon"
                    data-col="name">⌕</span></th>
                <th>Surname <span class="sort-icon" data-col="surname">⇅</span> <span class="filter-icon"
                    data-col="surname">⌕</span></th>
                <th>Age <span class="sort-icon" data-col="age">⇅</span></th>
                <th>Position <span class="sort-icon" data-col="position">⇅</span> <span class="filter-icon"
                    data-col="position">⌕</span></th>
                <th>Salary <span class="sort-icon" data-col="salary">⇅</span></th>
                <th>Est. Payment <span class="sort-icon" data-col="payment">⇅</span></th>
                <th>Projects</th>
                <th>Est. Income <span class="sort-icon" data-col="income">⇅</span></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="employeesBody"></tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <!-- Панель добавления проекта (выезжает справа) -->
  <div class="drawer" id="addProjectDrawer">
    <div class="drawer-content">
      <h3>Add Project</h3>
      <button class="drawer-close" id="closeProjectDrawer">×</button>
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="projectName" placeholder="Min 3 characters" />
        <span class="error-msg" id="projectNameError"></span>
      </div>
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="projectCompany" placeholder="Min 2 characters" />
        <span class="error-msg" id="projectCompanyError"></span>
      </div>
      <div class="form-group">
        <label>Budget</label>
        <input type="number" id="projectBudget" placeholder="Positive number" />
        <span class="error-msg" id="projectBudgetError"></span>
      </div>
      <div class="form-group">
        <label>Capacity</label>
        <input type="number" id="projectCapacity" placeholder="Min 1" />
        <span class="error-msg" id="projectCapacityError"></span>
      </div>
      <button class="submit-btn" id="submitProject" disabled>Add Project</button>
    </div>
  </div>

  <!-- Панель добавления сотрудника (выезжает справа) -->
  <div class="drawer" id="addEmployeeDrawer">
    <div class="drawer-content">
      <h3>Add Employee</h3>
      <button class="drawer-close" id="closeEmployeeDrawer">×</button>
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="empName" placeholder="Min 3 letters" />
        <span class="error-msg" id="empNameError"></span>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="empSurname" placeholder="Min 3 letters" />
        <span class="error-msg" id="empSurnameError"></span>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="empDob" />
        <span class="error-msg" id="empDobError"></span>
      </div>
      <div class="form-group">
        <label>Position</label>
        <select id="empPosition">
          <option value="">Select position</option>
          <option value="Junior">Junior</option>
          <option value="Middle">Middle</option>
          <option value="Senior">Senior</option>
          <option value="Lead">Lead</option>
          <option value="Architect">Architect</option>
          <option value="Business Manager">Business Manager</option>
        </select>
        <span class="error-msg" id="empPositionError"></span>
      </div>
      <div class="form-group">
        <label>Salary</label>
        <input type="number" id="empSalary" placeholder="Positive number" />
        <span class="error-msg" id="empSalaryError"></span>
      </div>
      <button class="submit-btn" id="submitEmployee" disabled>Add Employee</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
